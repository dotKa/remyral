# Exponential restart backoff for remyral-worker.service (systemd >= 254 only; the installer
# adds this drop-in only when systemd supports it — older systemd would warn about unknown keys
# and fall back to the fixed RestartSec=5s of the main unit anyway).
# 5 s, then growing in 8 steps up to 5 min between attempts while the daemon keeps crashing.
[Service]
RestartSteps=8
RestartMaxDelaySec=5min
