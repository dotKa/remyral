# p16-observability (docs/ops/monitoring.md §8): the master's /metrics (p6-otel) over the internal compose network.
# Used only with infra/monitoring/compose.monitoring.yaml (profile `monitoring`).
global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s

scrape_configs:
  - job_name: remyral-master
    metrics_path: /metrics
    scheme: http
    # The bearer token the master checks in constant time (METRICS_TOKEN_FILE); read from a file, never inline.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics.token
    static_configs:
      - targets: ['master:9464']
        labels:
          service: master

  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
