name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Security vulnerabilities do not belong here: use the repository's Security tab
        (private vulnerability reporting, see SECURITY.md). Redact host names, IP addresses, tokens, e-mail
        addresses and other personal data from everything you paste below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Control plane (master)
        - Web console
        - Worker
        - Installer / self-host bundle
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: e.g. 1.2.0 or the commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and architecture of the affected machine, Node version, agent runtime if relevant.
  - type: textarea
    id: logs
    attributes:
      label: Logs or diagnostics (redacted)
      render: text
