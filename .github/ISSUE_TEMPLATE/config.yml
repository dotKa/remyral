# Issue chooser: only the forms in this directory, plus these links. Security reports never go to a public issue.
blank_issues_enabled: false
contact_links:
  - name: Question
    url: https://github.com/dotKa/remyral/discussions/categories/q-a
    about: Ask how to install, configure or use Remyral in Discussions (Q&A).
  - name: Idea
    url: https://github.com/dotKa/remyral/discussions/categories/ideas
    about: Discuss an early or open-ended idea before it becomes a feature request.
  - name: Security vulnerability
    url: https://github.com/dotKa/remyral/security/advisories/new
    about: Report a vulnerability privately (see SECURITY.md). Never in a public issue.
