name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The control plane (master, console, selfhost / deploy / release tooling) runs on Linux only (README): the full
  # verification on both architectures it supports.
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    # A run takes 29-37 min (tests ~20-27 min of it; ~8 min more with two master files at once, below): 75 min is well
    # above that, and a hung step cannot hold a runner for the 6 h default.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # p7-secrets-scan scans the whole history.
          fetch-depth: 0
          # No later step pushes or calls the API: keep the token out of .git/config.
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          # setup-node v5 turns on its pnpm cache when package.json has packageManager, and that cache step
          # needs pnpm before `corepack enable` below has installed it ("Unable to locate executable file: pnpm").
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Master integration tests need Postgres + Redis (infra/dev).
      - name: Start dev stack
        run: pnpm dev:keygen && pnpm dev:up
      # The scripts tests run shellcheck when it is installed; its version decides which warnings it reports.
      - name: Tool versions
        run: shellcheck --version || true
      - run: pnpm verify
        env:
          REMYRAL_INTEGRATION: run
          # Two master test files at once, after the other projects (the 4-vCPU runner ran ~3 next to the rest:
          # load-dependent timing failures). The master files are ~57 min of file time: the test step grows by ~8 min.
          REMYRAL_MASTER_TEST_WORKERS: '2'
      - run: pnpm build
      # The built master refuses to start on a database with pending migrations (the dev stack starts empty).
      - name: Migrate the dev database
        working-directory: apps/master
        run: node --env-file=../../.env dist/cli/migrate.js
      - name: Smoke-start the built master
        run: node scripts/smoke-master.mjs
      # p7-secrets-scan (A-SEC-3): working tree + every commit, then the built web bundle with canaries in
      # the build environment (secret-looking values, server env names and `process.env` must not appear).
      - name: Secret scan (repository and history)
        if: runner.arch == 'X64'
        run: pnpm scan:secrets --history
      - name: Web bundle secret / env-leak scan with canaries
        if: runner.arch == 'X64'
        run: |
          REMYRAL_CANARY_SECRET="canary-$(openssl rand -hex 16)"
          VITE_REMYRAL_CANARY_TOKEN="canary-$(openssl rand -hex 16)"
          export REMYRAL_CANARY_SECRET VITE_REMYRAL_CANARY_TOKEN
          pnpm --filter @remyral/web build
          pnpm scan:secrets --bundle apps/web/dist --canary-env REMYRAL_CANARY_SECRET,VITE_REMYRAL_CANARY_TOKEN

  # macOS and Windows machines run only the worker (ADR-0002): its tests, the workspace packages it bundles
  # (apps/worker/package.json: agent-adapters, observability, protocol; agent-adapters needs protocol) and its
  # type check and build there. Lint, format, docs and the control-plane suites are platform-independent or
  # Linux-only and run in `verify` above.
  worker:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    # A worker run takes about 15 min; 40 min is well above that.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Type check (worker and its packages)
        run: pnpm --filter "@remyral/worker..." --workspace-concurrency=1 typecheck
      - name: Tests (worker and its packages)
        run: pnpm exec vitest run --project worker --project agent-adapters --project protocol --project observability
      - name: Build (worker and its packages)
        run: pnpm --filter "@remyral/worker..." --workspace-concurrency=1 build
      # The Windows installer's plan tests (plain assertions, no Pester) under the Windows PowerShell 5.1 it targets.
      - name: Windows installer plan tests
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -File infra\worker\windows\test\Install.Tests.ps1

  # Public-repository leak gate: owner-specific content (scripts/security/public-denylist.json) and secrets
  # (gitleaks, .gitleaks.toml) in the tracked tree and in every commit. Node built-ins only: no install needed.
  leaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Public denylist (tracked tree)
        run: node scripts/security/public-denylist.mjs --tree
      - name: Public denylist (history, commit messages and e-mails)
        if: always()
        run: node scripts/security/public-denylist.mjs --history
      - name: Install gitleaks (pinned release, sha256-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          # sha256 of gitleaks_8.30.1_linux_x64.tar.gz (the release's gitleaks_8.30.1_checksums.txt)
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: gitleaks (tracked tree)
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/tree"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/tree"
          "$RUNNER_TEMP/gitleaks" dir --redact --no-banner --config .gitleaks.toml "$RUNNER_TEMP/tree"
      - name: gitleaks (history)
        if: always()
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --config .gitleaks.toml .'
